name: CI/CD

# `verify` tourne sur chaque push et chaque pull request. `build` et `deploy`
# ne se déclenchent qu'après son succès, et seulement sur `main`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Adresse publique sondée après déploiement. Ce n'est pas un secret — elle
  # est imprimée sur chaque page du site — et la garder dans les secrets
  # empêchait de lire sa valeur le jour où la sonde échouait.
  SITE_URL: https://opaline.tadjo.dev
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/opaline-front
  NEXT_PUBLIC_API_URL: https://api.opaline.tadjo.dev/api

jobs:
  verify:
    name: Vérifier
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # `next typegen` d'abord : les types globaux de routes (`PageProps`,
      # `LayoutProps`, `RouteContext`) sont générés dans `.next/types`, qui
      # n'existe pas sur un dépôt fraîchement cloné. Sans lui, `tsc` échoue
      # sur « Cannot find name 'PageProps' ».
      - name: Types
        run: npm run typecheck

      # Sans `--fix` : la CI vérifie, elle ne corrige pas à la place de
      # l'auteur du commit.
      - name: Lint
        run: npx eslint .

      - name: Build
        run: npm run build

  build:
    name: Construire et publier l'image
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Déployer sur le VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Tirer l'image et redémarrer
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          # Le défaut de l'action est 10 min, et le seul `docker compose pull`
          # dépasse ce délai sur ce VPS : l'image fait plusieurs centaines de
          # mégaoctets et la machine héberge une quinzaine d'autres projets.
          # L'étape échouait alors que le déploiement, lui, se terminait.
          command_timeout: 20m
          script: |
            set -e
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

      # nginx-proxy-manager route déjà `opaline.tadjo.dev` vers le conteneur
      # `opaline-front` ; on vérifie ici depuis l'extérieur que le nouveau
      # conteneur a bien démarré et répond.
      - name: Vérifier que la boutique répond
        run: |
          # Un secret absent donne une adresse `https:///…` sur laquelle curl
          # échoue à chaque tentative : sans ce garde-fou, la cause se présente
          # comme une minute d'attente muette suivie d'un échec sans raison.
          # Le conteneur vient d'être recréé : sonder dans la seconde qui suit
          # ne teste que la vitesse de démarrage de Node.
          sleep 10

          echo "Sonde : ${{ env.SITE_URL }}/api/health"

          for i in $(seq 1 10); do
            # `|| true` : les `run:` tournent sous `bash -e`, et un curl en échec
            # — conteneur encore en train de démarrer — tuait le script dès la
            # première tentative au lieu de laisser la boucle faire son travail.
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ env.SITE_URL }}/api/health" || true)
            if [ "$code" = "200" ]; then
              echo "Boutique saine (${code})"
              exit 0
            fi
            echo "Tentative $i : ${code:-échec}, nouvelle tentative dans 5 s"
            sleep 5
          done
          echo "::error::La boutique ne répond pas après déploiement"
          exit 1
